revision: camber-selection-r3
adapter_revision: camber-evidence-r3
retrospective: true
sampling_seed: 42
sampling_unit: upstream_group
count: 100
candidate_pool: all_no_expansion_else_all_siblings
ranking: [category, information_scope, actor_literal_alignment, purpose_support, detail_token_count, numeric_id, exact_id]
category_order: [structural_candidate, uncertain, excluded]
scope_order: [unclear, general_information_indicator, public_indicator]
hard_exclusions: [missing_required_identity_or_context, QUESTION_SUBJECT_CONFLICT, QUESTION_SENDER_CONFLICT, QUESTION_RECIPIENT_CONFLICT, SOURCE_KNOWLEDGE_CONFLICT]
failed_groups: retain_without_replenishment
labels_used: false
approval_inheritance: forbidden
holdout_policy: record_all_270_groups_separately_no_new_splits
limitations: Pattern checks are incomplete; no semantic or production approval. Criteria were designed after the first ten records.

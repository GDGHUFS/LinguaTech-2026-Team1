# [B] 학습 전 초기 설정이다. 실제 pilot 실측 뒤 확정한다.
status: pilot_initial
finalized: null
optimizer: AdamW
learning_rate: 2.0e-5
max_epochs: 3
per_device_batch_size: 8
gradient_accumulation_steps: 2
world_size: 1
effective_batch_size: 16
weight_decay: 0.01
scheduler: linear
scheduler_status: implementation_initial_pending_pilot
seeds: [42, 43, 44]
seed_values_status: implementation_initial
lambda_state: 0.5
mu_relevance: 0.2
lambda_candidates: [0.25, 0.5, 1.0]
mu_candidates: [0.1, 0.2, 0.5]
models:
  A: {failure: true, state: false, relevance: false}
  C: {failure: true, state: true, relevance: false}
  C_plus: {failure: true, state: true, relevance: true}
state_loss: masked_mean_per_head
ignore_index: -100
selection_metric: validation_auprc
selection_tiebreak: lower_brier
max_grad_norm: 1.0
max_optimizer_steps: null
checkpoint_every_steps: null
tuning_trials: 3
tuning_policy: equal_full_runs_per_mode_per_seed
tuning_seed_policy: same_seed_for_all_trials_and_modes
validation_auprc_definition: average_precision_grouped_score_ties
missing_validation_class: stop_selection
resume_boundary: optimizer_step
device_processes: 1
test_split_access: forbidden
real_training_requires: external_gold_and_observed_failure_labels
freeze_policy: manual_after_real_pilot_measurements
